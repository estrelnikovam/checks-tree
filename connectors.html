/* ─── Atlassian Design System tokens ─────────────────────────────────────── */
:root {
  --ds-text:         #172B4D;
  --ds-text-subtle:  #44546F;

  --ds-link:         #0C66E4;

  --ds-neutral:      #F1F2F4;
  --ds-neutral-hover:#DCDFE4;
  --ds-hover:        #091E420F;
  --ds-border:       #DCDFE4;
  --ds-border-bold:  #8590A2;

  --ds-brand:        #0C66E4;
  --ds-brand-hover:  #0055CC;

  --ds-success-bg:   #DCFFF1;
  --ds-success-tx:   #216E4E;
  --ds-success-bold: #22A06B;
  --ds-info-bg:      #E9F2FF;

  --ds-neutral-bg:   #DCDFE4;
  --ds-neutral-tx:   #44546F;

  --ds-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Ubuntu, "Droid Sans", "Helvetica Neue", sans-serif;
  --ds-radius: 3px;
  --ds-radius-lg: 8px;
  --ds-shadow-card: 0 1px 1px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31);
  --ds-shadow-overlay: 0 0 0 1px rgba(9,30,66,.08), 0 8px 16px -4px rgba(9,30,66,.25), 0 0 1px rgba(9,30,66,.31);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--ds-font); background: transparent; color: var(--ds-text); padding: 8px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 940px; margin: 0; padding: 0; }

.topbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }

.vblock-title { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--ds-text-subtlest); margin-bottom: 8px; }

.vblock-fill-red   { height: 100%; border-radius: 100px; background: var(--ds-danger-bold); transition: width .4s; display: inline-block; float: left; }

.legend { display: flex; gap: 6px; font-size: 12px; color: var(--ds-text-subtlest); margin-bottom: 18px; flex-wrap: wrap; align-items: center; padding: 12px 16px; background: var(--ds-sunken); border: 1px solid var(--ds-border); border-radius: var(--ds-radius); }
.badge {

.no-checks-wrap { margin: 4px 0 4px 28px; }

.no-checks-tag  { font-size: 10px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; background: #fff; color: var(--ds-danger-tx); border-radius: var(--ds-radius); padding: 1px 6px; white-space: nowrap; }

/* ─── editing / comments ─────────────────────────────────────────────────── */
.cmt-icon { display: inline-flex; align-items: center; margin-left: 2px; color: var(--ds-text-subtlest); cursor: default; flex-shrink: 0; }
.cmt-icon:hover { color: var(--ds-text-subtle); }
.cmt-icon svg { display: block; }

#tip {
  position: fixed; z-index: 3000; max-width: 280px; display: none;
  background: var(--ds-text); color: #fff; font-size: 12px; line-height: 1.45;
  padding: 6px 10px; border-radius: var(--ds-radius); pointer-events: none;

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(9,30,66,.54); z-index: 4000;
  display: none; align-items: center; justify-content: center;

.modal {
  background: #fff; border-radius: var(--ds-radius-lg); padding: 24px 28px; width: 420px; max-width: 92vw;

}
.modal-title { font-size: 16px; font-weight: 600; color: var(--ds-text); margin-bottom: 2px; }
.modal-sub { font-size: 12px; color: var(--ds-text-subtlest); margin-bottom: 6px; }
.modal-lbl { display: block; font-size: 12px; font-weight: 600; color: var(--ds-text-subtle); margin: 14px 0 4px; }
.modal select, .modal textarea, .modal input {

.modal select:hover, .modal textarea:hover, .modal input:hover { background: var(--ds-neutral); }
.modal select:focus, .modal textarea:focus, .modal input:focus { outline: none; background: #fff; border-color: var(--ds-brand); }
.modal textarea { resize: vertical; }
.modal-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.btn { font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: var(--ds-radius); border: none; cursor: pointer; font-family: inherit; transition: background .1s; }
.btn-ghost { background: var(--ds-neutral); color: var(--ds-text-subtle); }
.btn-ghost:hover { background: var(--ds-neutral-hover); }
.btn-primary { background: var(--ds-brand); color: #fff; }
.btn-primary:hover { background: var(--ds-brand-hover); }
.btn-danger { background: transparent; color: var(--ds-danger-tx); }
.btn-danger:hover { background: var(--ds-danger-bg); }
.modal-err { color: var(--ds-danger-tx); font-size: 12px; margin-top: 10px; min-height: 14px; }

  { id: 'pfeifer-core',     type: 'Pfeifer Beam – Core',                  manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-pfeifer',      type: 'GL Column – Pfeifer Beam',             manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-pfeifer',      type: 'CLT Slab – Pfeifer Beam',              manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },

];

const SECTION_KEYS = ['resources','description','principles','resistance','inputs','derived','sorting','limitations','rfem'];

// ─── STATE ───────────────────────────────────────────────────────────────────
let overrides = {};      // nodeKey -> { status, comment, author, label, updatedAt }
const openState = {};    // toggle stateKey -> boolean (remembers expand/collapse across re-renders)

// Effective status of a leaf: Firestore override wins over seed.
function leafStatus(nodeKey, seedStatus) {
  const o = overrides[nodeKey];
  return (o && o.status) ? o.status : (seedStatus || 'todo');
}
function effSection(conn, key) { return leafStatus(conn.id + ':' + key, conn.sectionStatuses[key] || 'todo'); }
function effFilter(conn, i)    { return leafStatus(conn.id + ':fs:' + i, conn.filterSteps[i].status); }

// ─── STATS ─────────────────────────────────────────────────────────────────
function computeStats() {
  let leafDone = 0, leafTotal = 0;
  connectors.forEach(c => {
    const statuses = SECTION_KEYS.map(k => effSection(c, k))
                                 .concat(c.filterSteps.map((f, i) => effFilter(c, i)))
                                 .concat(fsAddedStatuses(c));
    leafTotal += statuses.length;
    leafDone  += statuses.filter(s => s === 'done').length;
  });
  const donePct = leafTotal ? Math.round(leafDone / leafTotal * 100) : 0;
  document.getElementById('bar-done').style.width   = donePct + '%';
  document.getElementById('stat-done').textContent  = leafDone;
  document.getElementById('stat-total').textContent = leafTotal;
  document.getElementById('stat-sub').textContent   = leafDone + '/' + leafTotal + ' items done';
}

// ─── DERIVED STATUS ──────────────────────────────────────────────────────────
const WIP_KEYS = ['done','wip','dev','qa','methodology','export','review','export_rfem','export_procurement'];
function derivedStatus(statuses) {
  if (!statuses.length) return 'todo';
  if (statuses.every(s => s === 'done')) return 'done';
  if (statuses.some(s => WIP_KEYS.includes(s))) return 'wip';
  return 'todo';
}

// ─── TOOLTIP ───────────────────────────────────────────────────────────────
const tip = document.getElementById('tip');
function fmtDate(ts) {
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate();
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function attachTip(el, meta) {
  el.addEventListener('mouseenter', () => {
    const when = fmtDate(meta.updatedAt);
    let html = '';
    if (meta.comment) html += esc(meta.comment);
    if (when) html += '<div class="tip-meta">Updated · ' + esc(when) + '</div>';
    if (!html) return;
    tip.innerHTML = html;
    tip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if (x + r.width  > window.innerWidth)  x = e.clientX - r.width  - pad;
    if (y + r.height > window.innerHeight) y = e.clientY - r.height - pad;
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ─── EDITOR MODAL ────────────────────────────────────────────────────────────
const backdrop   = document.getElementById('modal-backdrop');
const selEl      = document.getElementById('modal-status');
const commentEl  = document.getElementById('modal-comment');

const labelWrap  = document.getElementById('modal-label-wrap');
const labelInput = document.getElementById('modal-label-input');
const deleteBtn  = document.getElementById('modal-delete');
const errEl      = document.getElementById('modal-err');
let editing = null; // { key, seed, label, path, isSub, parentKey, isNew }

const MAX_FILTER_STEPS = 20;

// Added items live in Firestore as docs keyed `<parentKey>:sub:<id>` with isSub:true.
// Derived from the already-loaded `overrides`; soft-deleted ones are skipped.
function subKeysOf(parentKey) {
  const prefix = parentKey + ':sub:';
  return Object.keys(overrides)
    .filter(k => k.startsWith(prefix) && overrides[k] && overrides[k].isSub && !overrides[k].deleted)
    .sort((a, b) => (overrides[a].order || 0) - (overrides[b].order || 0));
}

STATUSES.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.key; opt.textContent = s.label;
  selEl.appendChild(opt);
});

function openEditor(key, seed, label, path, seedLink) {
  editing = { key, seed, label, path, isSub: false };
  const meta = overrides[key] || {};
  document.getElementById('modal-node-label').textContent = label;
  document.getElementById('modal-node-path').textContent  = path || '';
  labelWrap.style.display = 'none';
  deleteBtn.style.display = 'none';
  selEl.value     = meta.status || seed || 'todo';
  commentEl.value = meta.comment || '';
  linkEl.value    = meta.link || seedLink || '';
  errEl.textContent = '';
  backdrop.style.display = 'flex';
  selEl.focus();
}

function openSubEditor(parentKey, childKey, isNew, path) {
  const key  = isNew ? parentKey + ':sub:' + Date.now() : childKey;
  const meta = (!isNew && overrides[childKey]) ? overrides[childKey] : {};
  editing = { key, seed: 'todo', label: meta.label || '', path: path || '', isSub: true, parentKey, isNew };
  document.getElementById('modal-node-label').textContent = isNew ? 'New filter step' : (meta.label || 'Filter step');
  document.getElementById('modal-node-path').textContent  = path || '';
  labelWrap.style.display = '';
  labelInput.value = meta.label || '';
  selEl.value      = meta.status  || 'todo';
  commentEl.value  = meta.comment || '';
  linkEl.value     = meta.link    || '';
  deleteBtn.style.display = isNew ? 'none' : '';
  errEl.textContent = '';
  backdrop.style.display = 'flex';
  labelInput.focus();
}

function closeEditor() { backdrop.style.display = 'none'; editing = null; }

async function saveEditor() {
  if (!editing) return;
  const comment = commentEl.value.trim();
  const status  = selEl.value;
  let link = linkEl.value.trim();
  if (link && !/^https?:\/\//i.test(link)) link = 'https://' + link;

  const data = {
    status, comment, link,
    label: editing.label,
    path:  editing.path || '',
    updatedAt: serverTimestamp(),
  };

  if (editing.isSub) {
    const name = labelInput.value.trim();
    if (!name) { errEl.textContent = 'Enter a name'; labelInput.focus(); return; }
    if (editing.isNew && subKeysOf(editing.parentKey).length >= MAX_FILTER_STEPS) {
      errEl.textContent = 'Limit of ' + MAX_FILTER_STEPS + ' filter steps reached'; return;
    }
    data.label     = name;
    data.isSub     = true;
    data.parentKey = editing.parentKey;
    data.deleted   = false;
    data.order     = editing.isNew ? Date.now()
                                   : ((overrides[editing.key] && overrides[editing.key].order) || Date.now());
  }

  errEl.textContent = 'Saving…';
  try {
    await setDoc(doc(db, COLLECTION, editing.key), data);
    closeEditor(); // re-render happens via onSnapshot
  } catch (e) {
    errEl.textContent = 'Could not save: ' + (e && e.message ? e.message : e);
  }
}

async function deleteSub() {
  if (!editing || !editing.isSub || editing.isNew) return;
  errEl.textContent = 'Deleting…';
  try {
    // Soft delete (stays within existing Firestore write rules — comment is a string).
    await setDoc(doc(db, COLLECTION, editing.key), {
      deleted: true, isSub: true, parentKey: editing.parentKey,
      status: 'todo', comment: '', link: '',
      label: editing.label || '', path: editing.path || '',
      order: (overrides[editing.key] && overrides[editing.key].order) || Date.now(),
      updatedAt: serverTimestamp(),
    });
    closeEditor();
  } catch (e) {
    errEl.textContent = 'Could not delete: ' + (e && e.message ? e.message : e);
  }
}

document.getElementById('modal-save').onclick   = saveEditor;
document.getElementById('modal-delete').onclick = deleteSub;
document.getElementById('modal-cancel').onclick = closeEditor;
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeEditor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) closeEditor(); });

// ─── RENDER ──────────────────────────────────────────────────────────────────
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const COMMENT_SVG =
  '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
  '<path d="M3 2.5h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 13 11.5H7l-3.5 2.8V11.5H3A1.5 1.5 0 0 1 1.5 10V4A1.5 1.5 0 0 1 3 2.5z"/>' +
  '<path d="M4.5 6h7M4.5 8.3h4.5"/></svg>';

function makeToggle(subUl, expandAll, stateKey, defaultOpen) {
  const toggle = document.createElement('div');
  toggle.className = 'toggle';
  toggle.innerHTML = CHEVRON;
  const open = (stateKey in openState) ? openState[stateKey] : defaultOpen;
  subUl.style.display = open ? '' : 'none';
  toggle.classList.toggle('open', open);
  toggle.onclick = function () {
    const collapsed = subUl.style.display === 'none';
    if (collapsed) {
      subUl.style.display = '';
      if (expandAll) {
        subUl.querySelectorAll('ul').forEach(ul => ul.style.display = '');
        subUl.querySelectorAll('.toggle').forEach(t => t.classList.add('open'));
      }
      toggle.classList.add('open');
      openState[stateKey] = true;
    } else {
      subUl.style.display = 'none';
      toggle.classList.remove('open');
      openState[stateKey] = false;
    }
  };
  return toggle;
}

function renderLeaf(label, nodeKey, seedStatus, path, onEdit) {
  const status = leafStatus(nodeKey, seedStatus);
  const meta   = overrides[nodeKey];
  const cls = sCls(status), lbl = sLabel(status);
  const link = meta && meta.link;

  const li = document.createElement('li');
  li.className = 'tnode';

  const row = document.createElement('div');
  row.className = 'row leaf';
  row.title = 'Click to set status or link';
  row.onclick = onEdit || (() => openEditor(nodeKey, seedStatus, label, path));

  const spacer = document.createElement('div'); spacer.className = 'spacer'; row.appendChild(spacer);
  const stripe = document.createElement('div'); stripe.className = 'stripe s-' + cls; row.appendChild(stripe);

  const labelEl = document.createElement('span'); labelEl.className = 'label';
  if (link) {
    const a = document.createElement('a');
    a.href = link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label;
    a.onclick = e => e.stopPropagation();   // follow the link; don't open the editor
    labelEl.appendChild(a);
  } else {
    labelEl.textContent = label;
  }
  row.appendChild(labelEl);

  const badge = document.createElement('span');
  badge.className = 'badge b-' + cls;
  badge.textContent = lbl;
  row.appendChild(badge);

  if (meta) {
    attachTip(badge, meta);
    if (meta.comment) {
      const ic = document.createElement('span');
      ic.className = 'cmt-icon';
      ic.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 2.5h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 13 11.5H7l-3.5 2.8V11.5H3A1.5 1.5 0 0 1 1.5 10V4A1.5 1.5 0 0 1 3 2.5z"/>' +
        '<path d="M4.5 6h7M4.5 8.3h4.5"/></svg>';
      attachTip(ic, meta);
      row.appendChild(ic);
    }
  }

  li.appendChild(row);
  return li;
}

// Users can add extra filter steps into a connector's "Filter steps" group.
// They are stored in Firestore like sub-steps, keyed `<grpKey>:sub:<id>`.
function fsGroupKey(conn)      { return conn.id + ':fsgrp'; }
function fsAddedKeys(conn)     { return subKeysOf(fsGroupKey(conn)); }
function fsAddedStatuses(conn) { return fsAddedKeys(conn).map(k => (overrides[k] && overrides[k].status) || 'todo'); }

function renderGroup(label, childrenEl, statuses, stateKey, onAdd) {
  const status  = derivedStatus(statuses);
  const cls     = sCls(status);
  const done    = statuses.filter(s => s === 'done').length;
  const total   = statuses.length;
  const miniPct = total ? Math.round(done / total * 100) : 0;

  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';
  childrenEl.forEach(c => subUl.appendChild(c));

  const toggle = makeToggle(subUl, true, stateKey, true);

  const row = document.createElement('div');
  row.className = 'row';
  row.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe s-' + cls;
  row.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.textContent = label;
  row.appendChild(labelEl);

  const countEl = document.createElement('span');
  countEl.className = 'count';
  countEl.innerHTML = '<b>' + done + '</b>/' + total;
  row.appendChild(countEl);

  const miniEl = document.createElement('div');
  miniEl.className = 'mini';
  miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
  row.appendChild(miniEl);

  if (onAdd) {
    const add = document.createElement('span');
    add.className = 'add-sub';
    add.textContent = '+';
    add.title = 'Add a filter step';
    add.onclick = e => { e.stopPropagation(); onAdd(); };
    row.appendChild(add);
  }

  li.appendChild(row);
  li.appendChild(subUl);
  return li;
}

function renderConnector(conn) {
  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';

  const ctx = conn.type + ' (' + conn.manufacturer + ')';

  // Filter steps — seed steps plus any user-added ones (one level, capped).
  const fsCtx     = ctx + ' › Filter steps';
  const fsGrpKey  = fsGroupKey(conn);
  const fsAdded   = fsAddedKeys(conn);
  const fsLeaves  = conn.filterSteps.map((f, i) =>
                      renderLeaf(f.label, conn.id + ':fs:' + i, f.status, fsCtx))
                    .concat(fsAdded.map(ck =>
                      renderLeaf((overrides[ck] && overrides[ck].label) || '(unnamed)', ck, 'todo', fsCtx,
                        () => openSubEditor(fsGrpKey, ck, false, fsCtx))));
  const fsStatuses = conn.filterSteps.map((f, i) => effFilter(conn, i)).concat(fsAddedStatuses(conn));
  const fsOnAdd    = fsAdded.length < MAX_FILTER_STEPS
                       ? () => openSubEditor(fsGrpKey, null, true, fsCtx)
                       : null;
  const fsGroup    = renderGroup('Filter steps', fsLeaves, fsStatuses, conn.id + ':grp:fs', fsOnAdd);

  // Selection algorithm
  const selChildren = [
    renderLeaf('Input parameters',   conn.id + ':inputs',      conn.sectionStatuses.inputs      || 'todo', ctx + ' › Selection algorithm'),
    renderLeaf('Derived parameters', conn.id + ':derived',     conn.sectionStatuses.derived     || 'todo', ctx + ' › Selection algorithm'),
    fsGroup,
    renderLeaf('Sorting steps',      conn.id + ':sorting',     conn.sectionStatuses.sorting     || 'todo', ctx + ' › Selection algorithm'),
    renderLeaf('Limitations',        conn.id + ':limitations', conn.sectionStatuses.limitations || 'todo', ctx + ' › Selection algorithm'),
  ];
  const selStatuses = [
    effSection(conn, 'inputs'),
    effSection(conn, 'derived'),
    derivedStatus(fsStatuses),
    effSection(conn, 'sorting'),
    effSection(conn, 'limitations'),
  ];
  const selGroup = renderGroup('Selection algorithm', selChildren, selStatuses, conn.id + ':grp:sel');

  // Top-level section leaves
  [
    ['Resources',               'resources'],
    ['Description',             'description'],
    ['Principles of operation', 'principles'],
    ['Resistance derivation',   'resistance'],
  ].forEach(([lbl, key]) =>
    subUl.appendChild(renderLeaf(lbl, conn.id + ':' + key, conn.sectionStatuses[key] || 'todo', ctx)));

  subUl.appendChild(selGroup);
  subUl.appendChild(renderLeaf('RFEM Modelling', conn.id + ':rfem', conn.sectionStatuses.rfem || 'todo', ctx));

  const allLeafStatuses = SECTION_KEYS.map(k => effSection(conn, k)).concat(fsStatuses);
  const done    = allLeafStatuses.filter(s => s === 'done').length;
  const total   = allLeafStatuses.length;
  const started = allLeafStatuses.some(s => WIP_KEYS.includes(s));
  const miniPct = total ? Math.round(done / total * 100) : 0;

  // The connector node is itself editable: a status + link can be set on it
  // (stored in Firestore under the bare connector id). A manual status wins;
  // otherwise the lozenge is derived from its leaves.
  const ovr        = overrides[conn.id] || {};
  const derivedKey = (total && done === total) ? 'done' : started ? 'methodology' : 'todo';
  let effCls, effLabel;
  if (ovr.status)                   { effCls = sCls(ovr.status); effLabel = sLabel(ovr.status); }
  else if (total && done === total) { effCls = 'done'; effLabel = 'Done'; }
  else if (started)                 { effCls = 'wip';  effLabel = 'In Progress'; }
  else                              { effCls = 'todo'; effLabel = 'To Do'; }
  const effLink = ovr.link || conn.link || '';

  // "No methodology" banner — only while nothing is started and no status is set.
  if (!started && !ovr.status) {
    const warn = document.createElement('li');
    warn.className = 'tnode';
    warn.innerHTML =
      '<div class="no-checks-wrap"><div class="no-checks-row">' +
      '<span class="no-checks-icon">⚠️</span>' +
      '<span class="no-checks-text">No methodology provided yet — set a status below to start tracking.</span>' +
      '</div></div>';
    subUl.insertBefore(warn, subUl.firstChild);
  }

  const toggle = makeToggle(subUl, false, conn.id, false);
  toggle.addEventListener('click', e => e.stopPropagation());

  const topRow = document.createElement('div');
  topRow.className = 'row leaf';
  topRow.title = 'Click to set status or link';
  topRow.onclick = () => openEditor(conn.id, derivedKey, conn.type, 'Connector · ' + conn.manufacturer, effLink);
  topRow.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe s-' + effCls;
  topRow.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.innerHTML = (effLink
    ? '<a href="' + esc(effLink) + '" target="_blank" rel="noopener">' + esc(conn.type) + '</a>'
    : esc(conn.type)
  ) + '<span class="mfr-plain">(' + esc(conn.manufacturer) + ')</span>';
  const a = labelEl.querySelector('a');
  if (a) a.onclick = e => e.stopPropagation();
  topRow.appendChild(labelEl);

  const badge = document.createElement('span');
  badge.className = 'badge b-' + effCls;
  badge.textContent = effLabel;
  topRow.appendChild(badge);

  if (ovr.comment) {
    attachTip(badge, ovr);
    const ic = document.createElement('span');
    ic.className = 'cmt-icon';
    ic.innerHTML = COMMENT_SVG;
    attachTip(ic, ovr);
    topRow.appendChild(ic);
  }

  if (started) {
    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.innerHTML = '<b>' + done + '</b>/' + total;
    topRow.appendChild(countEl);

    const miniEl = document.createElement('div');
    miniEl.className = 'mini';
    miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
    topRow.appendChild(miniEl);
  }

  li.appendChild(topRow);
  li.appendChild(subUl);
  return li;
}

const root = document.getElementById('root');
function renderAll() {
  root.innerHTML = '';
  connectors.forEach(conn => root.appendChild(renderConnector(conn)));
  computeStats();
}

// First paint from seed (works even before Firestore responds).
renderAll();

// ─── LIVE SYNC ───────────────────────────────────────────────────────────────
const banner = document.getElementById('conn-banner');
onSnapshot(collection(db, COLLECTION), snap => {
  banner.style.display = 'none';
  overrides = {};
  snap.forEach(d => { overrides[d.id] = d.data(); });
  renderAll();
}, err => {
  console.error('Firestore error:', err);
  banner.textContent = 'Live status sync is unavailable (' + (err.code || err.message) + '). Showing last loaded data; changes may not save.';
  banner.style.display = 'block';
});
</script>
</body>
