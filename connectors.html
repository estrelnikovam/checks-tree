<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connectors Checks Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 1.5rem; }
.wrap { max-width: 920px; }

.topbar { display: flex; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; }
.vblock { background: #f5f5f3; border-radius: 8px; padding: 10px 16px; font-size: 13px; flex: 1; min-width: 200px; }
.vblock-title { font-weight: 500; font-size: 12px; color: #888; margin-bottom: 6px; }
.vblock-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.vblock-bar { flex: 1; height: 6px; border-radius: 3px; background: #e0e0da; overflow: hidden; }
.vblock-fill-green { height: 100%; border-radius: 3px; background: #1D9E75; transition: width .4s; display: inline-block; float: left; }
.vblock-fill-red   { height: 100%; border-radius: 3px; background: #E24B4A; transition: width .4s; display: inline-block; float: left; }
.vblock-num { font-size: 12px; color: #888; white-space: nowrap; }
.vblock-num b { color: #1a1a1a; font-weight: 500; }
.vblock-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

.legend { display: flex; gap: 8px; font-size: 12px; color: #888; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.b-done     { background: #EAF3DE; color: #3B6D11; }
.b-todo     { background: #FCEBEB; color: #A32D2D; }
.b-onhold   { background: #f0f0ec; color: #888; }
.b-wip      { background: #FFF3DC; color: #8a5c00; }

.mfr-plain { font-size: 13px; color: #888; font-weight: 400; margin-left: 3px; }

ul.tree { list-style: none; padding: 0; }
ul.tree ul { list-style: none; padding: 0; margin-left: 20px; border-left: 1.5px solid #e0e0da; }
li.tnode { padding: 0; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: default; user-select: none; }
.row:hover { background: #f5f5f3; }
.toggle { width: 16px; height: 16px; border-radius: 4px; border: 0.5px solid #ccc; background: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #888; }
.spacer { width: 16px; flex-shrink: 0; }
.label { font-size: 13px; flex: 1; min-width: 0; }
.label.group { font-weight: 500; }
.label a { color: #1a1a1a; text-decoration: none; border-bottom: 1px dashed #bbb; }
.label a:hover { color: #185FA5; border-bottom-color: #185FA5; }
.count { font-size: 12px; color: #888; white-space: nowrap; flex-shrink: 0; }
.count b { color: #1a1a1a; font-weight: 500; }
.mini { width: 36px; height: 5px; border-radius: 3px; background: #e8e8e4; overflow: hidden; flex-shrink: 0; }
.mini-f { height: 100%; border-radius: 3px; background: #1D9E75; }
.stripe { width: 8px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 22px; }
.s-done     { background: #1D9E75; }
.s-wip      { background: #EF9F27; }
.s-todo     { background: #E24B4A; }
.s-onhold   { background: #ccc; }

.no-checks-wrap { margin: 3px 0 3px 23px; }
.no-checks-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 6px;
  background: #fff6f6; border: 1px dashed #f0a0a0;
}
.no-checks-icon { font-size: 14px; flex-shrink: 0; }
.no-checks-text { font-size: 12px; color: #b02020; flex: 1; line-height: 1.4; }
.no-checks-tag  { font-size: 10px; background: #FCEBEB; color: #A32D2D; border-radius: 8px; padding: 1px 7px; white-space: nowrap; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="vblock">
      <div class="vblock-title">Overall progress</div>
      <div class="vblock-row">
        <div class="vblock-bar">
          <div class="vblock-fill-green" id="bar-done" style="width:0"></div>
        </div>
        <span class="vblock-num"><b id="stat-done">0</b>/<span id="stat-total">0</span> done</span>
      </div>
      <div class="vblock-sub" id="stat-sub"></div>
    </div>
  </div>

  <div class="legend">
    <span class="badge b-todo">To do <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Methodology <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Dev <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">QA <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to report <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Review <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to RFEM <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to Procurement <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-done">Done</span>
    <span class="badge b-onhold" style="margin-left:8px">On Hold</span>
  </div>

  <ul class="tree" id="root"></ul>
</div>
<script>
const STATUSES = [
  { key: 'todo',               label: 'To Do',                cls: 'todo'   },
  { key: 'onhold',             label: 'On Hold',              cls: 'onhold' },
  { key: 'methodology',        label: 'Methodology',          cls: 'wip'    },
  { key: 'dev',                label: 'Dev',                  cls: 'wip'    },
  { key: 'qa',                 label: 'QA',                   cls: 'wip'    },
  { key: 'export',             label: 'Export to report',     cls: 'wip'    },
  { key: 'review',             label: 'Review',               cls: 'wip'    },
  { key: 'export_rfem',        label: 'Export to RFEM',       cls: 'wip'    },
  { key: 'export_procurement', label: 'Export to Procurement',cls: 'wip'    },
  { key: 'done',               label: 'Done',                 cls: 'done'   },
];
function sCls(key)  { return (STATUSES.find(x => x.key === key) || { cls: 'todo' }).cls; }
function sLabel(key){ return (STATUSES.find(x => x.key === key) || { label: key }).label; }

// ─── DATA ────────────────────────────────────────────────────────────────────
// sectionStatuses keys: resources, description, principles, resistance,
//   inputs, derived, sorting, limitations, rfem
// filterSteps: individual checks inside Selection algorithm → Filter steps

const connectors = [
  {
    id: 'col-col',
    type: 'GL Column – GL Column',
    manufacturer: 'ALL3',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/1253310468',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance in y',          status: 'done' },
      { label: 'Screw resistance in z',          status: 'done' },
      { label: 'Shear resistance (knife plate)', status: 'done' },
      { label: 'Dowel resistance',               status: 'done' },
      { label: 'Glulam splitting resistance',    status: 'done' },
    ],
  },
  {
    id: 'col-found-all3',
    type: 'GL Column – Foundation',
    manufacturer: 'ALL3',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/1322090503',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance in y',           status: 'done' },
      { label: 'Screw resistance in z',           status: 'done' },
      { label: 'Anchor shear resistance in y',    status: 'done' },
      { label: 'Anchor shear resistance in z',    status: 'done' },
      { label: 'Concrete compression resistance', status: 'done' },
    ],
  },
  {
    id: 'beam-col-pitzl',
    type: 'GL Beam – GL Column',
    manufacturer: 'Pitzl HVP',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/901349382',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance',               status: 'done' },
      { label: 'Aluminium connector resistance', status: 'done' },
    ],
  },
  { id: 'pfeifer-col',      type: 'Pfeifer Beam – GL Column',             manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'pfeifer-core',     type: 'Pfeifer Beam – Core',                  manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-pfeifer',      type: 'GL Column – Pfeifer Beam',             manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-pfeifer',      type: 'CLT Slab – Pfeifer Beam',              manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-wall',         type: 'CLT Slab – Wall',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-core',         type: 'CLT Slab – Core',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'tcc-core',         type: 'TCC Slab – Core',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'beam-core-alumega',type: 'GL Beam – Core',                       manufacturer: 'Alumega',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'beam-core-all3',   type: 'GL Beam – Core',                       manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-found-peikko', type: 'GL Column – Foundation',               manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-delta-col',    type: 'GL Column – (Delta Beam) – GL Column', manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-delta',        type: 'GL Column – Delta Beam',               manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
];

// ─── STATS ───────────────────────────────────────────────────────────────────

const SECTION_KEYS = ['resources','description','principles','resistance','inputs','derived','sorting','limitations','rfem'];

function collectLeaves(conn) {
  const ss = conn.sectionStatuses;
  const total = SECTION_KEYS.length + conn.filterSteps.length;
  const done  = SECTION_KEYS.filter(k => ss[k] === 'done').length
              + conn.filterSteps.filter(f => f.status === 'done').length;
  return { done, total };
}

function computeStats() {
  let leafDone = 0, leafTotal = 0;
  connectors.forEach(c => {
    const l = collectLeaves(c);
    leafDone  += l.done;
    leafTotal += l.total;
  });
  const donePct = leafTotal ? Math.round(leafDone / leafTotal * 100) : 0;
  document.getElementById('bar-done').style.width  = donePct + '%';
  document.getElementById('stat-done').textContent = leafDone;
  document.getElementById('stat-total').textContent = leafTotal;
  document.getElementById('stat-sub').textContent   = leafDone + '/' + leafTotal + ' items done';
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function derivedStatus(statuses) {
  if (!statuses.length) return 'todo';
  if (statuses.every(s => s === 'done')) return 'done';
  if (statuses.some(s => s === 'done' || s === 'wip' || s === 'dev' || s === 'qa'
                      || s === 'methodology' || s === 'export' || s === 'review'
                      || s === 'export_rfem' || s === 'export_procurement')) return 'wip';
  return 'todo';
}

// ─── RENDER ──────────────────────────────────────────────────────────────────

function makeToggle(subUl, expandAll) {
  const toggle = document.createElement('div');
  toggle.className = 'toggle';
  toggle.textContent = '−';
  toggle.onclick = function() {
    const collapsed = subUl.style.display === 'none';
    if (collapsed) {
      subUl.style.display = '';
      if (expandAll) {
        subUl.querySelectorAll('ul').forEach(ul => ul.style.display = '');
        subUl.querySelectorAll('.toggle').forEach(t => t.textContent = '−');
      }
      toggle.textContent = '−';
    } else {
      subUl.style.display = 'none';
      toggle.textContent = '+';
    }
  };
  return toggle;
}

function renderLeaf(label, status) {
  const cls = sCls(status), lbl = sLabel(status);
  const li = document.createElement('li');
  li.className = 'tnode';
  li.innerHTML =
    '<div class="row">' +
      '<div class="spacer"></div>' +
      '<div class="stripe s-' + cls + '"></div>' +
      '<span class="label">' + label + '</span>' +
      '<span class="badge b-' + cls + '">' + lbl + '</span>' +
    '</div>';
  return li;
}

function renderGroup(label, childrenEl, statuses) {
  const status  = derivedStatus(statuses);
  const cls     = sCls(status);
  const done    = statuses.filter(s => s === 'done').length;
  const total   = statuses.length;
  const miniPct = total ? Math.round(done / total * 100) : 0;

  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';
  childrenEl.forEach(c => subUl.appendChild(c));

  const toggle = makeToggle(subUl, true);

  const row = document.createElement('div');
  row.className = 'row';
  row.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe s-' + cls;
  row.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.textContent = label;
  row.appendChild(labelEl);

  const countEl = document.createElement('span');
  countEl.className = 'count';
  countEl.innerHTML = '<b>' + done + '</b>/' + total;
  row.appendChild(countEl);

  const miniEl = document.createElement('div');
  miniEl.className = 'mini';
  miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
  row.appendChild(miniEl);

  li.appendChild(row);
  li.appendChild(subUl);
  return li;
}

function renderConnector(conn) {
  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';
  subUl.style.display = 'none';

  const ss = conn.sectionStatuses;
  const fs = conn.filterSteps;

  const fsLeaves   = fs.map(f => renderLeaf(f.label, f.status));
  const fsStatuses = fs.map(f => f.status);
  const fsGroup    = renderGroup('Filter steps', fsLeaves, fsStatuses);

  const selChildren = [
    renderLeaf('Input parameters',   ss.inputs      || 'todo'),
    renderLeaf('Derived parameters', ss.derived     || 'todo'),
    fsGroup,
    renderLeaf('Sorting steps',      ss.sorting     || 'todo'),
    renderLeaf('Limitations',        ss.limitations || 'todo'),
  ];
  const selStatuses = [
    ss.inputs      || 'todo',
    ss.derived     || 'todo',
    derivedStatus(fsStatuses),
    ss.sorting     || 'todo',
    ss.limitations || 'todo',
  ];
  const selGroup = renderGroup('Selection algorithm', selChildren, selStatuses);

  [
    ['Resources',               ss.resources   || 'todo'],
    ['Description',             ss.description || 'todo'],
    ['Principles of operation', ss.principles  || 'todo'],
    ['Resistance derivation',   ss.resistance  || 'todo'],
  ].forEach(([lbl, st]) => subUl.appendChild(renderLeaf(lbl, st)));

  subUl.appendChild(selGroup);
  subUl.appendChild(renderLeaf('RFEM Modelling', ss.rfem || 'todo'));

  const allLeafStatuses = SECTION_KEYS.map(k => ss[k] || 'todo').concat(fs.map(f => f.status));
  const done    = allLeafStatuses.filter(s => s === 'done').length;
  const total   = allLeafStatuses.length;
  const miniPct = total ? Math.round(done / total * 100) : 0;
  const stripeClass = done === total ? 's-done' : done > 0 ? 's-wip' : 's-todo';

  if (done === 0) {
    subUl.innerHTML = '';
    const warn = document.createElement('li');
    warn.className = 'tnode';
    warn.innerHTML =
      '<div class="no-checks-wrap"><div class="no-checks-row">' +
      '<span class="no-checks-icon">⚠️</span>' +
      '<span class="no-checks-text">No methodology provided yet</span>' +
      '</div></div>';
    subUl.appendChild(warn);
  }

  const toggle = makeToggle(subUl, false);
  toggle.textContent = '+';

  const topRow = document.createElement('div');
  topRow.className = 'row';
  topRow.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe ' + stripeClass;
  topRow.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.innerHTML = (conn.link
    ? '<a href="' + conn.link + '" target="_blank">' + conn.type + '</a>'
    : conn.type
  ) + '<span class="mfr-plain">(' + conn.manufacturer + ')</span>';
  topRow.appendChild(labelEl);

  if (done === 0) {
    const badge = document.createElement('span');
    badge.className = 'badge b-todo';
    badge.innerHTML = 'To do <span style="opacity:.6;font-size:10px">[TECH]</span>';
    topRow.appendChild(badge);
  } else {
    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.innerHTML = '<b>' + done + '</b>/' + total;
    topRow.appendChild(countEl);

    const miniEl = document.createElement('div');
    miniEl.className = 'mini';
    miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
    topRow.appendChild(miniEl);
  }

  li.appendChild(topRow);
  li.appendChild(subUl);
  return li;
}

const root = document.getElementById('root');
connectors.forEach(conn => root.appendChild(renderConnector(conn)));
computeStats();
</script>
</body>
</html>
