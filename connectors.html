<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connectors Checks Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 1.5rem; }
.wrap { max-width: 920px; }

.topbar { display: flex; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; }
.vblock { background: #f5f5f3; border-radius: 8px; padding: 10px 16px; font-size: 13px; flex: 1; min-width: 200px; }
.vblock-title { font-weight: 500; font-size: 12px; color: #888; margin-bottom: 6px; }
.vblock-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.vblock-bar { flex: 1; height: 6px; border-radius: 3px; background: #e0e0da; overflow: hidden; }
.vblock-fill-green { height: 100%; border-radius: 3px; background: #1D9E75; transition: width .4s; display: inline-block; float: left; }
.vblock-fill-red   { height: 100%; border-radius: 3px; background: #E24B4A; transition: width .4s; display: inline-block; float: left; }
.vblock-num { font-size: 12px; color: #888; white-space: nowrap; }
.vblock-num b { color: #1a1a1a; font-weight: 500; }
.vblock-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

.legend { display: flex; gap: 8px; font-size: 12px; color: #888; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.b-done     { background: #EAF3DE; color: #3B6D11; }
.b-todo     { background: #FCEBEB; color: #A32D2D; }
.b-onhold   { background: #f0f0ec; color: #888; }
.b-wip      { background: #FFF3DC; color: #8a5c00; }

.mfr-plain { font-size: 13px; color: #888; font-weight: 400; margin-left: 3px; }

ul.tree { list-style: none; padding: 0; }
ul.tree ul { list-style: none; padding: 0; margin-left: 20px; border-left: 1.5px solid #e0e0da; }
li.tnode { padding: 0; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: default; user-select: none; }
.row:hover { background: #f5f5f3; }
.toggle { width: 16px; height: 16px; border-radius: 4px; border: 0.5px solid #ccc; background: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #888; }
.spacer { width: 16px; flex-shrink: 0; }
.label { font-size: 13px; flex: 1; min-width: 0; }
.label.group { font-weight: 500; }
.label a { color: #1a1a1a; text-decoration: none; border-bottom: 1px dashed #bbb; }
.label a:hover { color: #185FA5; border-bottom-color: #185FA5; }
.count { font-size: 12px; color: #888; white-space: nowrap; flex-shrink: 0; }
.count b { color: #1a1a1a; font-weight: 500; }
.mini { width: 36px; height: 5px; border-radius: 3px; background: #e8e8e4; overflow: hidden; flex-shrink: 0; }
.mini-f { height: 100%; border-radius: 3px; background: #1D9E75; }
.stripe { width: 8px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 22px; }
.s-done     { background: #1D9E75; }
.s-wip      { background: #EF9F27; }
.s-todo     { background: #E24B4A; }
.s-onhold   { background: #ccc; }

.no-checks-wrap { margin: 3px 0 3px 23px; }
.no-checks-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 6px;
  background: #fff6f6; border: 1px dashed #f0a0a0;
}
.no-checks-icon { font-size: 14px; flex-shrink: 0; }
.no-checks-text { font-size: 12px; color: #b02020; flex: 1; line-height: 1.4; }
.no-checks-tag  { font-size: 10px; background: #FCEBEB; color: #A32D2D; border-radius: 8px; padding: 1px 7px; white-space: nowrap; font-weight: 600; }

/* ─── editing / comments ─────────────────────────────────────────────────── */
.badge.editable { cursor: pointer; }
.badge.editable:hover { outline: 1.5px solid rgba(0,0,0,.18); }
.cmt-icon { display: inline-flex; align-items: center; margin-left: 4px; color: #9a9a9a; cursor: default; flex-shrink: 0; }
.cmt-icon:hover { color: #555; }
.cmt-icon svg { display: block; }

#tip {
  position: fixed; z-index: 3000; max-width: 280px; display: none;
  background: #fff; color: #333; font-size: 12px; line-height: 1.5;
  padding: 9px 11px; border: 1px solid #e2e2dc; border-radius: 6px; pointer-events: none;
  box-shadow: 0 6px 20px rgba(0,0,0,.12); white-space: pre-wrap;
}
#tip .tip-meta { color: #999; font-size: 11px; margin-top: 6px; padding-top: 6px; border-top: 1px solid #efefe9; }

#conn-banner {
  display: none; background: #fff6f6; border: 1px dashed #f0a0a0; color: #b02020;
  font-size: 12px; padding: 8px 12px; border-radius: 6px; margin-bottom: 12px;
}

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 4000;
  display: none; align-items: center; justify-content: center;
}
.modal {
  background: #fff; border-radius: 10px; padding: 18px 20px; width: 360px; max-width: 92vw;
  box-shadow: 0 12px 44px rgba(0,0,0,.28);
}
.modal-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.modal-sub { font-size: 11px; color: #999; margin-bottom: 10px; }
.modal-lbl { display: block; font-size: 11px; color: #888; margin: 12px 0 4px; }
.modal select, .modal textarea, .modal input {
  width: 100%; font-size: 13px; padding: 7px 9px; border: 1px solid #ddd;
  border-radius: 6px; font-family: inherit; color: #1a1a1a; background: #fff;
}
.modal textarea { resize: vertical; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.btn { font-size: 13px; padding: 7px 16px; border-radius: 6px; border: 1px solid transparent; cursor: pointer; font-family: inherit; }
.btn-ghost { background: #f0f0ec; color: #444; }
.btn-ghost:hover { background: #e6e6e0; }
.btn-primary { background: #185FA5; color: #fff; }
.btn-primary:hover { background: #134d85; }
.modal-err { color: #b02020; font-size: 12px; margin-top: 10px; min-height: 14px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="conn-banner"></div>

  <div class="topbar">
    <div class="vblock">
      <div class="vblock-title">Overall progress</div>
      <div class="vblock-row">
        <div class="vblock-bar">
          <div class="vblock-fill-green" id="bar-done" style="width:0"></div>
        </div>
        <span class="vblock-num"><b id="stat-done">0</b>/<span id="stat-total">0</span> done</span>
      </div>
      <div class="vblock-sub" id="stat-sub"></div>
    </div>
  </div>

  <div class="legend">
    <span class="badge b-todo">To do <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Methodology <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Dev <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">QA <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to report <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Review <span style="opacity:.6;font-size:10px">[TECH]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to RFEM <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-wip">Export to Procurement <span style="opacity:.6;font-size:10px">[RTA]</span></span>
    <span style="color:#ccc;font-size:11px">→</span>
    <span class="badge b-done">Done</span>
    <span class="badge b-onhold" style="margin-left:8px">On Hold</span>
  </div>

  <ul class="tree" id="root"></ul>
</div>

<!-- shared tooltip -->
<div id="tip"></div>

<!-- status editor -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-title" id="modal-node-label"></div>
    <div class="modal-sub" id="modal-node-path"></div>

    <label class="modal-lbl" for="modal-status">Status</label>
    <select id="modal-status"></select>

    <label class="modal-lbl" for="modal-comment">Comment (shown on hover)</label>
    <textarea id="modal-comment" rows="3" placeholder="What changed / why — optional"></textarea>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-save">Save</button>
    </div>
    <div class="modal-err" id="modal-err"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, doc, setDoc, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ─── FIREBASE CONFIG ───────────────────────────────────────────────────────
// Paste the config from Firebase console → Project settings → Your apps → Web app.
// These values are NOT secret — they are meant to live in client code.
const firebaseConfig = {
  apiKey:            "AIzaSyC_svsE2-fbrK9paYj0guRKjKqYBnTLX98",
  authDomain:        "rta-connectors.firebaseapp.com",
  projectId:         "rta-connectors",
  storageBucket:     "rta-connectors.firebasestorage.app",
  messagingSenderId: "391974947370",
  appId:             "1:391974947370:web:49dd71cf2498bd8e1ad153",
  measurementId:     "G-528JR1JMVH",
};
const COLLECTION = 'connectorStatus';

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ─── STATUSES ──────────────────────────────────────────────────────────────
const STATUSES = [
  { key: 'todo',               label: 'To Do',                cls: 'todo'   },
  { key: 'onhold',             label: 'On Hold',              cls: 'onhold' },
  { key: 'methodology',        label: 'Methodology',          cls: 'wip'    },
  { key: 'dev',                label: 'Dev',                  cls: 'wip'    },
  { key: 'qa',                 label: 'QA',                   cls: 'wip'    },
  { key: 'export',             label: 'Export to report',     cls: 'wip'    },
  { key: 'review',             label: 'Review',               cls: 'wip'    },
  { key: 'export_rfem',        label: 'Export to RFEM',       cls: 'wip'    },
  { key: 'export_procurement', label: 'Export to Procurement',cls: 'wip'    },
  { key: 'done',               label: 'Done',                 cls: 'done'   },
];
function sCls(key)  { return (STATUSES.find(x => x.key === key) || { cls: 'todo' }).cls; }
function sLabel(key){ return (STATUSES.find(x => x.key === key) || { label: key }).label; }

// ─── DATA (seed) ─────────────────────────────────────────────────────────────
// sectionStatuses keys: resources, description, principles, resistance,
//   inputs, derived, sorting, limitations, rfem
// filterSteps: individual checks inside Selection algorithm → Filter steps
// Live status + comments are stored in Firestore and overlaid on top of this seed.

const connectors = [
  {
    id: 'col-col',
    type: 'GL Column – GL Column',
    manufacturer: 'ALL3',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/1253310468',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance in y',          status: 'done' },
      { label: 'Screw resistance in z',          status: 'done' },
      { label: 'Shear resistance (knife plate)', status: 'done' },
      { label: 'Dowel resistance',               status: 'done' },
      { label: 'Glulam splitting resistance',    status: 'done' },
    ],
  },
  {
    id: 'col-found-all3',
    type: 'GL Column – Foundation',
    manufacturer: 'ALL3',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/1322090503',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance in y',           status: 'done' },
      { label: 'Screw resistance in z',           status: 'done' },
      { label: 'Anchor shear resistance in y',    status: 'done' },
      { label: 'Anchor shear resistance in z',    status: 'done' },
      { label: 'Concrete compression resistance', status: 'done' },
    ],
  },
  {
    id: 'beam-col-pitzl',
    type: 'GL Beam – GL Column',
    manufacturer: 'Pitzl HVP',
    link: 'https://all3.atlassian.net/wiki/spaces/RTAP/pages/901349382',
    hasPage: true,
    sectionStatuses: {
      resources: 'done', description: 'done', principles: 'done', resistance: 'done',
      inputs: 'done', derived: 'done', sorting: 'done', limitations: 'done', rfem: 'done',
    },
    filterSteps: [
      { label: 'Screw resistance',               status: 'done' },
      { label: 'Aluminium connector resistance', status: 'done' },
    ],
  },
  { id: 'pfeifer-col',      type: 'Pfeifer Beam – GL Column',             manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'pfeifer-core',     type: 'Pfeifer Beam – Core',                  manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-pfeifer',      type: 'GL Column – Pfeifer Beam',             manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-pfeifer',      type: 'CLT Slab – Pfeifer Beam',              manufacturer: 'Pfeifer',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-wall',         type: 'CLT Slab – Wall',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'clt-core',         type: 'CLT Slab – Core',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'tcc-core',         type: 'TCC Slab – Core',                      manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'beam-core-alumega',type: 'GL Beam – Core',                       manufacturer: 'Alumega',           hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'beam-core-all3',   type: 'GL Beam – Core',                       manufacturer: 'ALL3',              hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-found-peikko', type: 'GL Column – Foundation',               manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-delta-col',    type: 'GL Column – (Delta Beam) – GL Column', manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
  { id: 'col-delta',        type: 'GL Column – Delta Beam',               manufacturer: 'Peikko Rooco Shoe', hasPage: false, sectionStatuses: {}, filterSteps: [] },
];

const SECTION_KEYS = ['resources','description','principles','resistance','inputs','derived','sorting','limitations','rfem'];

// ─── STATE ───────────────────────────────────────────────────────────────────
let overrides = {};      // nodeKey -> { status, comment, author, label, updatedAt }
const openState = {};    // toggle stateKey -> boolean (remembers expand/collapse across re-renders)

// Effective status of a leaf: Firestore override wins over seed.
function leafStatus(nodeKey, seedStatus) {
  const o = overrides[nodeKey];
  return (o && o.status) ? o.status : (seedStatus || 'todo');
}
function effSection(conn, key) { return leafStatus(conn.id + ':' + key, conn.sectionStatuses[key] || 'todo'); }
function effFilter(conn, i)    { return leafStatus(conn.id + ':fs:' + i, conn.filterSteps[i].status); }

// ─── STATS ─────────────────────────────────────────────────────────────────
function computeStats() {
  let leafDone = 0, leafTotal = 0;
  connectors.forEach(c => {
    const statuses = SECTION_KEYS.map(k => effSection(c, k))
                                 .concat(c.filterSteps.map((f, i) => effFilter(c, i)));
    leafTotal += statuses.length;
    leafDone  += statuses.filter(s => s === 'done').length;
  });
  const donePct = leafTotal ? Math.round(leafDone / leafTotal * 100) : 0;
  document.getElementById('bar-done').style.width   = donePct + '%';
  document.getElementById('stat-done').textContent  = leafDone;
  document.getElementById('stat-total').textContent = leafTotal;
  document.getElementById('stat-sub').textContent   = leafDone + '/' + leafTotal + ' items done';
}

// ─── DERIVED STATUS ──────────────────────────────────────────────────────────
const WIP_KEYS = ['done','wip','dev','qa','methodology','export','review','export_rfem','export_procurement'];
function derivedStatus(statuses) {
  if (!statuses.length) return 'todo';
  if (statuses.every(s => s === 'done')) return 'done';
  if (statuses.some(s => WIP_KEYS.includes(s))) return 'wip';
  return 'todo';
}

// ─── TOOLTIP ───────────────────────────────────────────────────────────────
const tip = document.getElementById('tip');
function fmtDate(ts) {
  if (!ts || !ts.toDate) return '';
  const d = ts.toDate();
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function attachTip(el, meta) {
  el.addEventListener('mouseenter', () => {
    const when = fmtDate(meta.updatedAt);
    let html = '';
    if (meta.comment) html += esc(meta.comment);
    if (when) html += '<div class="tip-meta">Updated · ' + esc(when) + '</div>';
    if (!html) return;
    tip.innerHTML = html;
    tip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    const pad = 14;
    let x = e.clientX + pad, y = e.clientY + pad;
    const r = tip.getBoundingClientRect();
    if (x + r.width  > window.innerWidth)  x = e.clientX - r.width  - pad;
    if (y + r.height > window.innerHeight) y = e.clientY - r.height - pad;
    tip.style.left = x + 'px';
    tip.style.top  = y + 'px';
  });
  el.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

// ─── EDITOR MODAL ────────────────────────────────────────────────────────────
const backdrop  = document.getElementById('modal-backdrop');
const selEl     = document.getElementById('modal-status');
const commentEl = document.getElementById('modal-comment');
const errEl     = document.getElementById('modal-err');
let editing = null; // { key, seed, label, path }

STATUSES.forEach(s => {
  const opt = document.createElement('option');
  opt.value = s.key; opt.textContent = s.label;
  selEl.appendChild(opt);
});

function openEditor(key, seed, label, path) {
  editing = { key, seed, label, path };
  const meta = overrides[key] || {};
  document.getElementById('modal-node-label').textContent = label;
  document.getElementById('modal-node-path').textContent  = path || '';
  selEl.value     = meta.status || seed || 'todo';
  commentEl.value = meta.comment || '';
  errEl.textContent = '';
  backdrop.style.display = 'flex';
  selEl.focus();
}
function closeEditor() { backdrop.style.display = 'none'; editing = null; }

async function saveEditor() {
  if (!editing) return;
  const comment = commentEl.value.trim();
  const status  = selEl.value;
  errEl.textContent = 'Saving…';
  try {
    await setDoc(doc(db, COLLECTION, editing.key), {
      status, comment,
      label: editing.label,
      path:  editing.path || '',
      updatedAt: serverTimestamp(),
    });
    closeEditor(); // re-render happens via onSnapshot
  } catch (e) {
    errEl.textContent = 'Could not save: ' + (e && e.message ? e.message : e);
  }
}

document.getElementById('modal-save').onclick   = saveEditor;
document.getElementById('modal-cancel').onclick = closeEditor;
backdrop.addEventListener('click', e => { if (e.target === backdrop) closeEditor(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && editing) closeEditor(); });

// ─── RENDER ──────────────────────────────────────────────────────────────────
function makeToggle(subUl, expandAll, stateKey, defaultOpen) {
  const toggle = document.createElement('div');
  toggle.className = 'toggle';
  const open = (stateKey in openState) ? openState[stateKey] : defaultOpen;
  subUl.style.display = open ? '' : 'none';
  toggle.textContent  = open ? '−' : '+';
  toggle.onclick = function () {
    const collapsed = subUl.style.display === 'none';
    if (collapsed) {
      subUl.style.display = '';
      if (expandAll) {
        subUl.querySelectorAll('ul').forEach(ul => ul.style.display = '');
        subUl.querySelectorAll('.toggle').forEach(t => t.textContent = '−');
      }
      toggle.textContent = '−';
      openState[stateKey] = true;
    } else {
      subUl.style.display = 'none';
      toggle.textContent = '+';
      openState[stateKey] = false;
    }
  };
  return toggle;
}

function renderLeaf(label, nodeKey, seedStatus, path) {
  const status = leafStatus(nodeKey, seedStatus);
  const meta   = overrides[nodeKey];
  const cls = sCls(status), lbl = sLabel(status);

  const li = document.createElement('li');
  li.className = 'tnode';

  const row = document.createElement('div');
  row.className = 'row';

  const spacer = document.createElement('div'); spacer.className = 'spacer'; row.appendChild(spacer);
  const stripe = document.createElement('div'); stripe.className = 'stripe s-' + cls; row.appendChild(stripe);
  const labelEl = document.createElement('span'); labelEl.className = 'label'; labelEl.textContent = label; row.appendChild(labelEl);

  const badge = document.createElement('span');
  badge.className = 'badge editable b-' + cls;
  badge.textContent = lbl;
  badge.onclick = () => openEditor(nodeKey, seedStatus, label, path);
  row.appendChild(badge);

  if (meta) {
    attachTip(badge, meta);
    if (meta.comment) {
      const ic = document.createElement('span');
      ic.className = 'cmt-icon';
      ic.innerHTML = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M3 2.5h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 13 11.5H7l-3.5 2.8V11.5H3A1.5 1.5 0 0 1 1.5 10V4A1.5 1.5 0 0 1 3 2.5z"/>' +
        '<path d="M4.5 6h7M4.5 8.3h4.5"/></svg>';
      attachTip(ic, meta);
      row.appendChild(ic);
    }
  }

  li.appendChild(row);
  return li;
}

function renderGroup(label, childrenEl, statuses, stateKey) {
  const status  = derivedStatus(statuses);
  const cls     = sCls(status);
  const done    = statuses.filter(s => s === 'done').length;
  const total   = statuses.length;
  const miniPct = total ? Math.round(done / total * 100) : 0;

  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';
  childrenEl.forEach(c => subUl.appendChild(c));

  const toggle = makeToggle(subUl, true, stateKey, true);

  const row = document.createElement('div');
  row.className = 'row';
  row.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe s-' + cls;
  row.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.textContent = label;
  row.appendChild(labelEl);

  const countEl = document.createElement('span');
  countEl.className = 'count';
  countEl.innerHTML = '<b>' + done + '</b>/' + total;
  row.appendChild(countEl);

  const miniEl = document.createElement('div');
  miniEl.className = 'mini';
  miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
  row.appendChild(miniEl);

  li.appendChild(row);
  li.appendChild(subUl);
  return li;
}

function renderConnector(conn) {
  const li = document.createElement('li');
  li.className = 'tnode';

  const subUl = document.createElement('ul');
  subUl.className = 'tree';

  const ctx = conn.type + ' (' + conn.manufacturer + ')';

  // Filter steps
  const fsLeaves   = conn.filterSteps.map((f, i) =>
    renderLeaf(f.label, conn.id + ':fs:' + i, f.status, ctx + ' › Filter steps'));
  const fsStatuses = conn.filterSteps.map((f, i) => effFilter(conn, i));
  const fsGroup    = renderGroup('Filter steps', fsLeaves, fsStatuses, conn.id + ':grp:fs');

  // Selection algorithm
  const selChildren = [
    renderLeaf('Input parameters',   conn.id + ':inputs',      conn.sectionStatuses.inputs      || 'todo', ctx + ' › Selection algorithm'),
    renderLeaf('Derived parameters', conn.id + ':derived',     conn.sectionStatuses.derived     || 'todo', ctx + ' › Selection algorithm'),
    fsGroup,
    renderLeaf('Sorting steps',      conn.id + ':sorting',     conn.sectionStatuses.sorting     || 'todo', ctx + ' › Selection algorithm'),
    renderLeaf('Limitations',        conn.id + ':limitations', conn.sectionStatuses.limitations || 'todo', ctx + ' › Selection algorithm'),
  ];
  const selStatuses = [
    effSection(conn, 'inputs'),
    effSection(conn, 'derived'),
    derivedStatus(fsStatuses),
    effSection(conn, 'sorting'),
    effSection(conn, 'limitations'),
  ];
  const selGroup = renderGroup('Selection algorithm', selChildren, selStatuses, conn.id + ':grp:sel');

  // Top-level section leaves
  [
    ['Resources',               'resources'],
    ['Description',             'description'],
    ['Principles of operation', 'principles'],
    ['Resistance derivation',   'resistance'],
  ].forEach(([lbl, key]) =>
    subUl.appendChild(renderLeaf(lbl, conn.id + ':' + key, conn.sectionStatuses[key] || 'todo', ctx)));

  subUl.appendChild(selGroup);
  subUl.appendChild(renderLeaf('RFEM Modelling', conn.id + ':rfem', conn.sectionStatuses.rfem || 'todo', ctx));

  const allLeafStatuses = SECTION_KEYS.map(k => effSection(conn, k)).concat(fsStatuses);
  const done    = allLeafStatuses.filter(s => s === 'done').length;
  const total   = allLeafStatuses.length;
  const started = allLeafStatuses.some(s => WIP_KEYS.includes(s));
  const miniPct = total ? Math.round(done / total * 100) : 0;
  const stripeClass = done === total ? 's-done' : started ? 's-wip' : 's-todo';

  // "No methodology" banner — shown when nothing has been started yet,
  // but the leaves below stay editable so anyone can start moving it forward.
  if (!started) {
    const warn = document.createElement('li');
    warn.className = 'tnode';
    warn.innerHTML =
      '<div class="no-checks-wrap"><div class="no-checks-row">' +
      '<span class="no-checks-icon">⚠️</span>' +
      '<span class="no-checks-text">No methodology provided yet — set a status below to start tracking.</span>' +
      '</div></div>';
    subUl.insertBefore(warn, subUl.firstChild);
  }

  const toggle = makeToggle(subUl, false, conn.id, false);

  const topRow = document.createElement('div');
  topRow.className = 'row';
  topRow.appendChild(toggle);

  const stripe = document.createElement('div');
  stripe.className = 'stripe ' + stripeClass;
  topRow.appendChild(stripe);

  const labelEl = document.createElement('span');
  labelEl.className = 'label group';
  labelEl.innerHTML = (conn.link
    ? '<a href="' + conn.link + '" target="_blank" rel="noopener">' + conn.type + '</a>'
    : conn.type
  ) + '<span class="mfr-plain">(' + conn.manufacturer + ')</span>';
  topRow.appendChild(labelEl);

  if (!started) {
    const badge = document.createElement('span');
    badge.className = 'badge b-todo';
    badge.innerHTML = 'To do <span style="opacity:.6;font-size:10px">[TECH]</span>';
    topRow.appendChild(badge);
  } else {
    const countEl = document.createElement('span');
    countEl.className = 'count';
    countEl.innerHTML = '<b>' + done + '</b>/' + total;
    topRow.appendChild(countEl);

    const miniEl = document.createElement('div');
    miniEl.className = 'mini';
    miniEl.innerHTML = '<div class="mini-f" style="width:' + miniPct + '%"></div>';
    topRow.appendChild(miniEl);
  }

  li.appendChild(topRow);
  li.appendChild(subUl);
  return li;
}

const root = document.getElementById('root');
function renderAll() {
  root.innerHTML = '';
  connectors.forEach(conn => root.appendChild(renderConnector(conn)));
  computeStats();
}

// First paint from seed (works even before Firestore responds).
renderAll();

// ─── LIVE SYNC ───────────────────────────────────────────────────────────────
const banner = document.getElementById('conn-banner');
onSnapshot(collection(db, COLLECTION), snap => {
  banner.style.display = 'none';
  overrides = {};
  snap.forEach(d => { overrides[d.id] = d.data(); });
  renderAll();
}, err => {
  console.error('Firestore error:', err);
  banner.textContent = 'Live status sync is unavailable (' + (err.code || err.message) + '). Showing last loaded data; changes may not save.';
  banner.style.display = 'block';
});
</script>
