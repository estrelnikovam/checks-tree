<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Checks Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 1.5rem; }
.wrap { max-width: 920px; }
.topbar { display: flex; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; }
.vblock { background: #f5f5f3; border-radius: 8px; padding: 10px 16px; font-size: 13px; flex: 1; min-width: 200px; }
.vblock-title { font-weight: 500; font-size: 12px; color: #888; margin-bottom: 6px; }
.vblock-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.vblock-bar { flex: 1; height: 6px; border-radius: 3px; background: #e0e0da; overflow: hidden; }
.vblock-fill { height: 100%; border-radius: 3px; background: #1D9E75; transition: width .4s; }
.vblock-num { font-size: 12px; color: #888; white-space: nowrap; }
.vblock-num b { color: #1a1a1a; font-weight: 500; }
.vblock-sub { font-size: 11px; color: #aaa; margin-top: 2px; }
.legend { display: flex; gap: 8px; font-size: 12px; color: #888; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.b-done       { background: #EAF3DE; color: #3B6D11; }
.b-todo       { background: #FCEBEB; color: #A32D2D; }
.b-onhold     { background: #f0f0ec; color: #888; }
.b-wip        { background: #FFF3DC; color: #8a5c00; }
.ver { font-size: 10px; padding: 1px 5px; border-radius: 3px; font-weight: 500; flex-shrink: 0; }
.ver-v1 { background: #EAF3DE; color: #3B6D11; }
.ver-v2 { background: #E6F1FB; color: #185FA5; }
ul.tree { list-style: none; padding: 0; }
ul.tree ul { list-style: none; padding: 0; margin-left: 20px; border-left: 1.5px solid #e0e0da; }
li.tnode { padding: 0; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: default; user-select: none; }
.row:hover { background: #f5f5f3; }
.toggle { width: 16px; height: 16px; border-radius: 4px; border: 0.5px solid #ccc; background: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #888; }
.spacer { width: 16px; flex-shrink: 0; }
.label { font-size: 13px; flex: 1; min-width: 0; }
.label.group { font-weight: 500; }
.label a { color: #1a1a1a; text-decoration: none; border-bottom: 1px dashed #bbb; }
.label a:hover { color: #185FA5; border-bottom-color: #185FA5; }
.count { font-size: 12px; color: #888; white-space: nowrap; flex-shrink: 0; }
.count b { color: #1a1a1a; font-weight: 500; }
.mini { width: 36px; height: 5px; border-radius: 3px; background: #e8e8e4; overflow: hidden; flex-shrink: 0; }
.mini-f { height: 100%; border-radius: 3px; background: #1D9E75; }
.stripe { width: 8px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 22px; }
.s-done   { background: #1D9E75; }
.s-wip    { background: #EF9F27; }
.s-todo   { background: #E24B4A; }
.s-onhold { background: #ccc; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="vblock">
      <div class="vblock-title">Version 1</div>
      <div class="vblock-row">
        <div class="vblock-bar"><div class="vblock-fill" id="bar-v1" style="width:0"></div></div>
        <span class="vblock-num"><b id="done-v1">0</b>/<span id="total-v1">0</span> done</span>
      </div>
      <div class="vblock-sub" id="breakdown-v1"></div>
    </div>
    <div class="vblock">
      <div class="vblock-title">Version 2</div>
      <div class="vblock-row">
        <div class="vblock-bar"><div class="vblock-fill" id="bar-v2" style="width:0"></div></div>
        <span class="vblock-num"><b id="done-v2">0</b>/<span id="total-v2">0</span> done</span>
      </div>
      <div class="vblock-sub" id="breakdown-v2"></div>
    </div>
  </div>
  <div class="legend">
    <span class="badge b-done">Done</span>
    <span class="badge b-wip">Methodology</span>
    <span class="badge b-wip">Code</span>
    <span class="badge b-wip">Validation</span>
    <span class="badge b-wip">Export</span>
    <span class="badge b-todo">To Do</span>
    <span class="badge b-onhold">On Hold</span>
    <span style="margin-left:8px" class="ver ver-v1">v1</span>
    <span class="ver ver-v2">v2</span>
  </div>
  <ul class="tree" id="root"></ul>
</div>
<script>
const STATUSES = [
  { key:'todo',        label:'To Do',       cls:'todo' },
  { key:'onhold',      label:'On Hold',     cls:'onhold' },
  { key:'methodology', label:'Methodology', cls:'wip' },
  { key:'code',        label:'Code',        cls:'wip' },
  { key:'validation',  label:'Validation',  cls:'wip' },
  { key:'export',      label:'Export',      cls:'wip' },
  { key:'done',        label:'Done',        cls:'done' },
];

function sCls(key){ return (STATUSES.find(x=>x.key===key)||{cls:'todo'}).cls; }
function sLabel(key){ return (STATUSES.find(x=>x.key===key)||{label:key}).label; }

const data = [
  { id:'beams', label:'Beams', children:[
    { id:'glulam-beam', label:'Glulam beam', children:[
      { id:'gb-uls', label:'ULS', children:[
        { id:'gb-uls-bend', label:'Bending', ver:'v1', status:'done', link:'#gb-uls-bend' },
      ]},
      { id:'gb-ulsfire', label:'ULS Fire', children:[
        { id:'gb-ulsfire-bend', label:'Bending', ver:'v1', status:'done', link:'#gb-ulsfire-bend' },
      ]},
      { id:'gb-sls', label:'SLS', children:[
        { id:'gb-sls-defl', label:'Deflection', ver:'v1', status:'done', link:'#gb-sls-defl' },
      ]},
      { id:'gb-vib', label:'Vibration', children:[
        { id:'gb-vib-1', label:'Vibration check', ver:'v2', status:'onhold', link:'#gb-vib-1' },
      ]},
    ]},
    { id:'pfeifer-beam', label:'Composite beam Pfeifer', children:[
      { id:'pb-uls', label:'ULS', children:[
        { id:'pb-uls-bend', label:'Bending', ver:'v1', status:'done', link:'#pb-uls-bend' },
      ]},
      { id:'pb-ulsfire', label:'ULS Fire', children:[
        { id:'pb-ulsfire-bend', label:'Bending', ver:'v1', status:'done', link:'#pb-ulsfire-bend' },
      ]},
      { id:'pb-sls', label:'SLS', children:[
        { id:'pb-sls-defl', label:'Deflection', ver:'v1', status:'done', link:'#pb-sls-defl' },
      ]},
      { id:'pb-v2', label:'ULS', children:[
        { id:'pb-v2-shear', label:'Shear', ver:'v2', status:'onhold', link:'#pb-v2-shear' },
      ]},
    ]},
    { id:'delta-beam', label:'Composite beam Delta', children:[
      { id:'db-uls', label:'ULS', children:[
        { id:'db-uls-bend',  label:'Bending', ver:'v1', status:'methodology', link:'#db-uls-bend' },
        { id:'db-uls-shear', label:'Shear',   ver:'v2', status:'onhold',        link:'#db-uls-shear' },
      ]},
      { id:'db-ulsfire', label:'ULS Fire', children:[
        { id:'db-ulsfire-bend', label:'Bending', ver:'v1', status:'code', link:'#db-ulsfire-bend' },
      ]},
      { id:'db-sls', label:'SLS', children:[
        { id:'db-sls-defl', label:'Deflection', ver:'v1', status:'methodology', link:'#db-sls-defl' },
      ]},
    ]},
  ]},
  { id:'columns', label:'Columns', children:[
    { id:'glulam-col', label:'Glulam column', children:[
      { id:'gc-uls', label:'ULS', children:[
        { id:'gc-uls-bend',  label:'Bending', ver:'v1', status:'code',    link:'#gc-uls-bend' },
        { id:'gc-uls-shear', label:'Shear',   ver:'v2', status:'onhold',    link:'#gc-uls-shear' },
      ]},
      { id:'gc-ulsfire', label:'ULS Fire', children:[
        { id:'gc-ulsfire-bend', label:'Bending', ver:'v1', status:'code', link:'#gc-ulsfire-bend' },
      ]},
      { id:'gc-sls', label:'SLS', children:[
        { id:'gc-sls-defl', label:'Deflection', ver:'v1', status:'methodology', link:'#gc-sls-defl' },
      ]},
    ]},
  ]},
];

const collapsed = new Set(['glulam-beam','pfeifer-beam','delta-beam','glulam-col']);

function leaves(n){ return n.children ? n.children.flatMap(leaves) : [n]; }

function groupStatus(n){
  const ls = leaves(n);
  if(ls.every(x=>x.status==='done')) return 'done';
  if(ls.every(x=>x.status==='onhold')) return 'onhold';
  if(ls.every(x=>x.status==='todo')) return 'todo';
  return 'wip';
}

function buildNode(n, depth){
  const isGroup = !!n.children;
  const st = isGroup ? groupStatus(n) : sCls(n.status);
  const ls = leaves(n);
  const done = ls.filter(x=>x.status==='done').length;
  const total = ls.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const isCol = collapsed.has(n.id);

  let inner = `<div class="row">
    <div class="stripe s-${st}"></div>
    ${isGroup
      ? `<div class="toggle" onclick="tog('${n.id}')">${isCol?'▸':'▾'}</div>`
      : `<div class="spacer"></div>`}
    <span class="label${isGroup?' group':''}">`;

  inner += isGroup ? n.label : `<a href="${n.link}" target="_blank">${n.label}</a>`;
  inner += `</span>`;

  if(!isGroup){
    inner += `<span class="ver ver-${n.ver}">${n.ver}</span>`;
    inner += `<span class="badge b-${sCls(n.status)}">${sLabel(n.status)}</span>`;
  } else {
    inner += `<div class="mini"><div class="mini-f" style="width:${pct}%"></div></div>
      <span class="count"><b>${done}</b>/${total}</span>`;
  }
  inner += `</div>`;

  let children = '';
  if(isGroup && !isCol){
    children = `<ul>${n.children.map(c=>buildNode(c,depth+1)).join('')}</ul>`;
  }
  return `<li class="tnode">${inner}${children}</li>`;
}

function updateStats(){
  const all = data.flatMap(leaves);
  const v1 = all.filter(x=>x.ver==='v1');
  const v2 = all.filter(x=>x.ver==='v2');
  const d1 = v1.filter(x=>x.status==='done').length;
  const d2 = v2.filter(x=>x.status==='done').length;
  const p1 = v1.length ? Math.round(d1/v1.length*100) : 0;
  const p2 = v2.length ? Math.round(d2/v2.length*100) : 0;

  document.getElementById('bar-v1').style.width = p1+'%';
  document.getElementById('bar-v2').style.width = p2+'%';
  document.getElementById('done-v1').textContent = d1;
  document.getElementById('done-v2').textContent = d2;
  document.getElementById('total-v1').textContent = v1.length;
  document.getElementById('total-v2').textContent = v2.length;

  function breakdown(arr){
    return STATUSES.filter(s=>s.key!=='done').map(s=>{
      const c = arr.filter(x=>x.status===s.key).length;
      return c>0 ? `${c} ${s.label}` : null;
    }).filter(Boolean).join(' · ');
  }
  document.getElementById('breakdown-v1').textContent = breakdown(v1);
  document.getElementById('breakdown-v2').textContent = breakdown(v2);
}

function render(){
  document.getElementById('root').innerHTML = data.map(n=>buildNode(n,0)).join('');
  updateStats();
}

window.tog = function(id){
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  render();
};

render();
</script>
</body>
</html>
