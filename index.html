<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structural Checks Tree</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #1a1a1a; padding: 1.5rem; }
.wrap { max-width: 920px; }

.topbar { display: flex; gap: 12px; margin-bottom: 1rem; flex-wrap: wrap; }
.vblock { background: #f5f5f3; border-radius: 8px; padding: 10px 16px; font-size: 13px; flex: 1; min-width: 200px; }
.vblock-title { font-weight: 500; font-size: 12px; color: #888; margin-bottom: 6px; }
.vblock-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.vblock-bar { flex: 1; height: 6px; border-radius: 3px; background: #e0e0da; overflow: hidden; }
.vblock-fill { height: 100%; border-radius: 3px; background: #1D9E75; transition: width .4s; }
.vblock-num { font-size: 12px; color: #888; white-space: nowrap; }
.vblock-num b { color: #1a1a1a; font-weight: 500; }
.vblock-sub { font-size: 11px; color: #aaa; margin-top: 2px; }

.legend { display: flex; gap: 6px; font-size: 12px; color: #888; margin-bottom: 1.25rem; flex-wrap: wrap; align-items: center; }
.legend-arrow { color: #ccc; font-size: 11px; }
.badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
.b-done   { background: #EAF3DE; color: #3B6D11; }
.b-todo   { background: #FCEBEB; color: #A32D2D; }
.b-onhold { background: #f0f0ec; color: #888; }
.b-wip    { background: #FFF3DC; color: #8a5c00; }

ul.tree { list-style: none; padding: 0; }
ul.tree ul { list-style: none; padding: 0; margin-left: 20px; border-left: 1.5px solid #e0e0da; }
li.tnode { padding: 0; }
.row { display: flex; align-items: center; gap: 7px; padding: 4px 6px; border-radius: 6px; cursor: default; user-select: none; }
.row:hover { background: #f5f5f3; }
.toggle { width: 16px; height: 16px; border-radius: 4px; border: 0.5px solid #ccc; background: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; color: #888; }
.spacer { width: 16px; flex-shrink: 0; }
.label { font-size: 13px; flex: 1; min-width: 0; }
.label.group { font-weight: 500; }
.label a { color: #1a1a1a; text-decoration: none; border-bottom: 1px dashed #bbb; }
.label a:hover { color: #185FA5; border-bottom-color: #185FA5; }
.count { font-size: 12px; color: #888; white-space: nowrap; flex-shrink: 0; }
.count b { color: #1a1a1a; font-weight: 500; }
.mini { width: 36px; height: 5px; border-radius: 3px; background: #e8e8e4; overflow: hidden; flex-shrink: 0; }
.mini-f { height: 100%; border-radius: 3px; background: #1D9E75; }
.stripe { width: 8px; flex-shrink: 0; border-radius: 2px; align-self: stretch; min-height: 22px; }
.s-done   { background: #1D9E75; }
.s-wip    { background: #EF9F27; }
.s-todo   { background: #E24B4A; }
.s-onhold { background: #ccc; }
</style>
</head>

const collapsed = new Set(['glulam-beam','pfeifer-beam','glulam-col','clt-slab','tcc-slab','clt-wall','conc-wall']);

function leaves(n){ return n.children ? n.children.flatMap(leaves) : [n]; }

function groupStatus(n){
  const ls = leaves(n);
  if(ls.every(x=>x.status==='done'))   return 'done';
  if(ls.every(x=>x.status==='onhold')) return 'onhold';
  if(ls.every(x=>x.status==='todo'))   return 'todo';
  return 'wip';
}

function buildNode(n, depth){
  const isGroup = !!n.children;
  const st = isGroup ? groupStatus(n) : sCls(n.status);
  const ls = leaves(n);
  const done = ls.filter(x=>x.status==='done').length;
  const total = ls.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const isCol = collapsed.has(n.id);

  let inner = `<div class="row">
    <div class="stripe s-${st}"></div>
    ${isGroup
      ? `<div class="toggle" onclick="tog('${n.id}')">${isCol?'▸':'▾'}</div>`
      : `<div class="spacer"></div>`}
    <span class="label${isGroup?' group':''}">`;

  inner += isGroup ? n.label : `<a href="${n.link}" target="_blank">${n.label}</a>`;
  inner += `</span>`;

  if(!isGroup){
    inner += `<span class="badge b-${sCls(n.status)}">${sLabel(n.status)}</span>`;
  } else {
    inner += `<div class="mini"><div class="mini-f" style="width:${pct}%"></div></div>
      <span class="count"><b>${done}</b>/${total}</span>`;
  }
  inner += `</div>`;

  let children = '';
  if(isGroup && !isCol){
    children = `<ul>${n.children.map(c=>buildNode(c,depth+1)).join('')}</ul>`;
  }
  return `<li class="tnode">${inner}${children}</li>`;
}

function updateStats(){
  const all = data.flatMap(leaves);
  const done = all.filter(x=>x.status==='done').length;
  const total = all.length;
  const pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('bar-all').style.width = pct+'%';
  document.getElementById('done-all').textContent = done;
  document.getElementById('total-all').textContent = total;

  const parts = STATUSES.filter(s=>s.key!=='done').map(s=>{
    const c = all.filter(x=>x.status===s.key).length;
    return c>0 ? `${c} ${s.label}` : null;
  }).filter(Boolean).join(' · ');
  document.getElementById('breakdown-all').textContent = parts;
}

function render(){
  document.getElementById('root').innerHTML = data.map(n=>buildNode(n,0)).join('');
  updateStats();
}

window.tog = function(id){
  collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
  render();
};

render();
